name: CI

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Verify legacy baseline
        run: |
          # The URL first, and before anything reads the submodule. A pull request supplies its own
          # .gitmodules, and scripts/legacy-oracle.mjs runs pq-web-src/config.js and main.js through
          # vm.runInContext during npm test - so an unpinned URL is arbitrary code arriving from a
          # repository that is not this one, and that CodeQL does not scan. The status check below
          # cannot catch it: a fork changes the URL and the gitlink together and it still reports
          # clean.
          test "$(git config -f .gitmodules submodule.pq-web-src.url)" = "https://bitbucket.org/grumdrig/pq-web.git"
          test -f pq-web-src/main.js
          test "$(git submodule status --recursive | cut -c1)" = " "

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          package-manager-cache: false

      - name: Install dependencies
        # --ignore-scripts because a pull request supplies its own package.json, and a lifecycle
        # hook would run before the suite a reviewer is actually reading. Nothing here needs one:
        # the Playwright browsers are installed by the explicit step below.
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        # Both engines the suite runs against. WebKit earns its download: running it found
        # unstyled controls inheriting the platform button face at 1.81:1, and tooltips that
        # accumulated because it does not focus a button on tap - neither visible to Chromium.
        run: npx playwright install --with-deps chromium webkit

      - name: Quality gate
        run: npm run quality

  # Blocks a pull request that introduces a dependency with a known advisory, before it is
  # merged and before `npm audit` would catch it on main. Pull-request event only: it compares
  # the base and head manifests, so it has nothing to compare on a push.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Matches the threshold `npm run audit` enforces, so the two gates cannot disagree
          # about what is acceptable.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
