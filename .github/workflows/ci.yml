name: CI

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          package-manager-cache: false

      - name: Install dependencies
        # --ignore-scripts because a pull request supplies its own package.json, and a lifecycle
        # hook would run before the suite a reviewer is actually reading. Nothing here needs one:
        # the Playwright browsers are installed by the explicit step below.
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        # Chromium only in this job. WebKit is downloaded by the browser-parity job below, which
        # is the whole point of the split: this gate no longer waits for a 100MB browser it does
        # not run.
        run: npx playwright install --with-deps chromium

      - name: Quality gate
        run: npm run quality

  # WebKit, on its own runner and off the critical path.
  #
  # It is not optional and it is not slower by accident. Measured against the same suite, chromium
  # sums 320s of test time against webkit's 1213s - roughly 4x, with a per-test median of 3.4x and
  # no hot spot anywhere. That profile is uniform driver and engine cost, so there is nothing to
  # optimise: no single test, fixture or helper whose repair moves the number. Both leads this
  # issue proposed were measured and refuted - serving a production build cannot work while the
  # suite makes 30 runtime `import('/src/...')` calls, and the axe scans cost the same 4.2x as the
  # tests that run no scan at all.
  #
  # So the cost is real, permanent, and worth paying. WebKit is what caught unstyled controls
  # inheriting the platform button face at 1.81:1, and tooltips accumulating because it does not
  # focus a button on tap. Neither was visible to Chromium.
  #
  # Splitting it changes no coverage. It only stops every other check waiting behind it.
  browser-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: WebKit browser suite
        run: npm run test:e2e:webkit

  # The single required status check, and deliberately a job that does no work.
  #
  # Branch protection requires one context by name, `quality`. When the WebKit suite moved onto its
  # own runner, that name stopped covering it — a pull request could go green and merge with WebKit
  # failing, which was impossible while both ran in one job. Splitting the work quietly narrowed
  # what the gate was asserting.
  #
  # Rather than widen the protection rule to name every job, which then has to be edited by hand
  # each time a job is added or renamed, this job fans in. It fails if either half fails, so the
  # rule keeps meaning "everything passed" without knowing what everything is.
  quality:
    runs-on: ubuntu-latest
    needs: [checks, browser-parity]
    # always(), and the results are read explicitly, because `needs` alone is not enough here. A
    # job whose dependency fails is *skipped*, not failed, and a skipped required check is not
    # reliably treated as blocking — the behaviour differs by how the skip arose and is not
    # something a merge gate should rest on. Running unconditionally and asserting each result
    # turns an ambiguity into a definite red.
    if: always()
    steps:
      - name: Confirm every suite passed
        env:
          CHECKS: ${{ needs.checks.result }}
          BROWSER_PARITY: ${{ needs.browser-parity.result }}
        run: |
          echo "checks=$CHECKS browser-parity=$BROWSER_PARITY"
          if [ "$CHECKS" != "success" ] || [ "$BROWSER_PARITY" != "success" ]; then
            echo "::error::A required suite did not succeed."
            exit 1
          fi

  # Blocks a pull request that introduces a dependency with a known advisory, before it is
  # merged and before `npm audit` would catch it on main. Pull-request event only: it compares
  # the base and head manifests, so it has nothing to compare on a push.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Matches the threshold `npm run audit` enforces, so the two gates cannot disagree
          # about what is acceptable.
          fail-on-severity: moderate
          # No comment-summary-in-pr. Posting one needs `pull-requests: write`, this job has
          # `contents: read`, and the summary silently never appeared — protection that reads as
          # working is worse than none. Granting the scope was the other option and is a poor
          # trade: it would widen a token on a job that processes untrusted pull-request content,
          # to buy a comment that fork PRs can never receive anyway, since GitHub caps their token
          # read-only regardless. The failing check is the protection; the run log carries the
          # detail.
