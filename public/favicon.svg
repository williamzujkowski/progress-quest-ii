<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Progress Quest II">
  <title>Progress Quest II</title>
  <!--
    Original artwork for this project. The crossed swords match the mark the header already
    carries, drawn here rather than borrowed so the icon's provenance is the repository itself.

    The field is opaque and matches the manifest's background colour, so the mark stays legible
    against a light or a dark OS background without depending on either.
  -->
  <rect width="512" height="512" rx="96" fill="#100d09"/>
  <rect x="18" y="18" width="476" height="476" rx="80" fill="none" stroke="#2f271d" stroke-width="10"/>

  <!--
    One sword, defined once and placed twice at opposing angles. Sharing the definition keeps the
    two blades identical, which is what makes the crossing read as a matched pair.
  -->
  <defs>
    <g id="sword">
      <path d="M256 76 L274 136 L274 314 L238 314 L238 136 Z" fill="#cfc9bd"/>
      <path d="M256 76 L274 136 L256 136 Z" fill="#8b8478"/>
      <path d="M238 136 L256 136 L256 314 L238 314 Z" fill="#e2ddd3"/>
      <rect x="196" y="314" width="120" height="26" rx="9" fill="#b8912f"/>
      <rect x="245" y="340" width="22" height="56" rx="9" fill="#6b4f27"/>
      <circle cx="256" cy="406" r="18" fill="#b8912f"/>
    </g>
  </defs>

  <g transform="rotate(41 256 256)"><use href="#sword"/></g>
  <g transform="rotate(-41 256 256)"><use href="#sword"/></g>
</svg>
